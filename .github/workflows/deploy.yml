name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ===== 阶段 1: 代码拉取 =====
      - name: Checkout
        uses: actions/checkout@v4

      # ===== 阶段 2: 前置校验（在 CI 侧快速失败，不占用服务器） =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (CI 校验)
        run: |
          cd frontend
          npm config set registry https://registry.npmjs.org
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Backend (CI 校验)
        run: |
          cd backend
          pip install -r requirements.txt -i https://pypi.org/simple/
          python -m py_compile app/main.py

      # ===== 阶段 3: 服务器拉取源码并本地构建 =====
      # 为何由服务器主动拉取：
      # CI 运行在 GitHub 海外 runner，向国内服务器传输源码属跨境上行链路——
      # 实测同一操作从 44 秒恶化到 18 分钟未完成（与推镜像同源的跨境瓶颈）。
      # 改为：服务器主动下载 GitHub 归档（跨境下行通常更稳定，且带重试），
      # CI 仅做 SSH 触发（小数据）。镜像在服务器本地构建，不再有任何跨境大流量。
      - name: Pull source and build on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # 下载 + 构建 + 重启的总预算（构建耗时取决于服务器性能）
          command_timeout: 25m
          script: |
            set -e
            cd /root/kb-service
            echo "=== 下载源码 ${{ github.sha }} ==="
            curl -fsSL --retry 3 --retry-delay 5 --max-time 300 \
              -o /tmp/kb-src.tar.gz \
              "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz"
            rm -rf /tmp/kb-src && mkdir -p /tmp/kb-src
            tar xzf /tmp/kb-src.tar.gz -C /tmp/kb-src --strip-components=1
            echo "=== 同步源码（保留服务器上的 .env 与 data 目录）==="
            cp -rf /tmp/kb-src/backend/. backend/
            cp -rf /tmp/kb-src/frontend/. frontend/
            cp -f /tmp/kb-src/docker-compose.prod.yml .
            echo "=== 本地构建镜像 ==="
            docker compose -f docker-compose.prod.yml build
            echo "=== 重启服务 ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "=== 当前状态 ==="
            docker compose -f docker-compose.prod.yml ps
