name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ===== 阶段 1: 代码拉取 =====
      - name: Checkout
        uses: actions/checkout@v4

      # ===== 阶段 2: 前置校验（在 CI 侧快速失败，不占用服务器） =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (CI 校验)
        run: |
          cd frontend
          npm config set registry https://registry.npmjs.org
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Backend (CI 校验)
        run: |
          cd backend
          pip install -r requirements.txt -i https://pypi.org/simple/
          python -m py_compile app/main.py

      # ===== 阶段 3: 同步源码到服务器 =====
      # 架构说明：镜像构建在服务器本地执行，CI 不再构建与推送镜像。
      # 原方案（海外 runner 构建 → 跨境推送阿里云 ACR → 服务器拉取）在跨境网络
      # 不稳时会卡死在 pushing layers——实测同一环节从 9.6 秒恶化到 30 分钟零进展，
      # 且镜像全量约 300MB（解压）/ 80-100MB（压缩），不适合跨国传输。
      # 现改为只同步源码（体积约几百 KB），由国内服务器本地构建，全程无跨境大流量。
      - name: Sync source to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "backend/,frontend/,docker-compose.prod.yml"
          target: /root/kb-service/
          # 排除构建产物与本地文件，避免覆盖服务器上的 .env / 数据
          exclude: "**/node_modules/**,**/dist/**,**/__pycache__/**,**/*.pyc,**/.env,**/.env.*,**/.git/**"
          overwrite: true

      # ===== 阶段 4: 服务器本地构建并重启 =====
      - name: Build and Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # 服务器本地构建耗时取决于机器性能，给足余量
          command_timeout: 20m
          script: |
            set -e
            cd /root/kb-service
            echo "=== 本地构建镜像 ==="
            docker compose -f docker-compose.prod.yml build
            echo "=== 重启服务 ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "=== 当前状态 ==="
            docker compose -f docker-compose.prod.yml ps
